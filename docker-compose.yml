version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Pre-deploy checklist (run once on the Swarm manager) — or just run ./setup.sh
# which automates all of this.
# ─────────────────────────────────────────────────────────────────────────────
#  1. NFS-Share mounten (falls noch nicht geschehen):
#       sudo mkdir -p /volume1/cloudstorage
#       echo "<NAS_IP>:/volume1/cloudstorage /volume1/cloudstorage nfs nfsvers=4,hard,intr,noac,_netdev,nofail 0 0" | sudo tee -a /etc/fstab
#       sudo mount -a
#
#  2. Datenverzeichnisse auf der NAS anlegen (einmalig, auf dem Manager-Pi):
#       sudo mkdir -p /volume1/cloudstorage/docker-swarm-data/roleplayer
#       sudo mkdir -p /volume1/cloudstorage/docker-swarm-data/minio/roleplayer
#       sudo chmod 777 /volume1/cloudstorage/docker-swarm-data/roleplayer
#       sudo chmod 777 /volume1/cloudstorage/docker-swarm-data/minio/roleplayer
#
#  3. Deployen:
#       docker build --platform linux/arm64 -t roleplayer:latest .
#       docker stack deploy -c docker-compose.yml roleplayer
#
#  Erreichbar unter:
#    http://pi1:3002   (kein Mikrofon-Zugriff möglich - Browser blockieren
#                       getUserMedia außerhalb von HTTPS/localhost)
#    https://pi1:3502  (selbstsigniertes Zertifikat, siehe setup.sh;
#                       Zertifikatswarnung im Browser einmalig bestätigen)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── App (Spring Boot backend + embedded React frontend) ────────────────────
  # NOTE: network_mode: host is required for reliable Discord voice support.
  # JDA's voice connections use UDP with a dynamic port negotiated directly
  # with Discord's voice servers (IP discovery). When the app runs on Docker
  # Swarm's overlay network (the previous config — ports were only published
  # in `mode: host`, but the container itself was still on the `internal`
  # overlay network), that UDP traffic gets NATed/mangled by the overlay
  # network and the voice handshake fails almost immediately after connecting
  # — this is the root cause of the bot joining a channel and then instantly
  # reporting ERROR_LOST_CONNECTION / leaving again. Host networking makes
  # the container share the Pi's network stack directly, avoiding this NAT
  # entirely. See docs/discord-bot-setup.md for details.
  app:
    image: roleplayer:latest
    network_mode: host
    environment:
      PORT: "3002"
      HTTPS_PORT: "3502"
      DB_PATH: /data/roleplayer.db
      MINIO_ENDPOINT: http://localhost:9004
      MINIO_PUBLIC_URL: http://pi1:9004
      MINIO_BUCKET: roleplayer
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-roleplayer}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-roleplayer123}
      ASR_URL: ${ASR_URL:-http://Stefans-PC:9090}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    volumes:
      - sqlite-data:/data
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/chronicles"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager

  # ── MinIO (character sheet PDF storage) ─────────────────────────────────────
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-roleplayer}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-roleplayer123}
    volumes:
      - minio-data:/data
    networks:
      - internal
    ports:
      # 9004 (API) / 9005 (Console) — avoids clashing with taster (80/8443/3000)
      # and mealplaner (3001/9002/9003)
      - target: 9000
        published: 9004
        mode: host
      - target: 9001
        published: 9005
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager

networks:
  internal:
    driver: overlay
    attachable: true

volumes:
  sqlite-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/cloudstorage/docker-swarm-data/roleplayer

  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/cloudstorage/docker-swarm-data/minio/roleplayer
