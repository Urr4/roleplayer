spring.application.name=roleplayer

# ── SQLite ─────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/roleplayer.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── MinIO / PDF storage ──────────────────────────────────────────────────────
storage.type=minio
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.bucket=${MINIO_BUCKET:roleplayer}
minio.access-key=${MINIO_ACCESS_KEY:roleplayer}
minio.secret-key=${MINIO_SECRET_KEY:roleplayer123}

# ── Web ────────────────────────────────────────────────────────────────────────
spring.web.resources.add-mappings=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.port=${PORT:3002}
