# ── Local dev profile ─────────────────────────────────────────────────────────
# Activate with: --spring.profiles.active=local (see run-local.sh)
#
# Uses in-memory stub repositories (adapter/memory package) instead of SQLite,
# and an in-memory PDF store instead of MinIO. All data is volatile and reset
# on every restart — handy for quick local demos/dev without any external
# services running.

# Skip JPA/DataSource auto-configuration entirely — nothing in this profile
# talks to a real database.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

# Disables the MinIO beans (they're @ConditionalOnProperty(storage.type=minio));
# adapter/memory's InMemoryPdfStore takes over instead.
storage.type=stub

server.port=${PORT:3002}
