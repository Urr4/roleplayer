spring.application.name=roleplayer

# ── SQLite ─────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/roleplayer.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── MinIO / PDF storage ──────────────────────────────────────────────────────
storage.type=minio
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.bucket=${MINIO_BUCKET:roleplayer}
minio.access-key=${MINIO_ACCESS_KEY:roleplayer}
minio.secret-key=${MINIO_SECRET_KEY:roleplayer123}

# ── ASR (WhisperX transcription service) ─────────────────────────────────────
asr.base-url=${ASR_URL:http://localhost:9090}
asr.model=${ASR_MODEL:large-v3}
asr.language=${ASR_LANGUAGE:de}

# ── Discord (voice channel recording) ────────────────────────────────────────
# Leave DISCORD_BOT_TOKEN unset to disable Discord recording entirely (no bean
# is created, so the app still starts fine without a configured bot).
discord.bot-token=${DISCORD_BOT_TOKEN:}

# ── Web ────────────────────────────────────────────────────────────────────────
spring.web.resources.add-mappings=true
# Audio uploads can be much larger than PDFs, especially for longer recordings.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.port=${PORT:3002}
