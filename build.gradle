plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'de.urr4.rp'
version = '0.0.1-SNAPSHOT'
description = 'roleplayer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://maven.lavalink.dev/snapshots')
    }
}

// libdave-jvm (DAVE E2EE protocol support, required for Discord voice since
// March 2026 - close code 4017 otherwise, see docs/discord-bot-setup.md #5)
// is only published as "git commit" versions, not semver releases.
def libdaveVersion = 'ce725965e'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'net.dv8tion:JDA:6.5.0'
    implementation 'club.minnced:opus-java:1.1.1'

    // ── Discord DAVE protocol (mandatory E2EE for voice since March 2026) ──────
    implementation "moe.kyokobot.libdave:adapter-jda:${libdaveVersion}"
    implementation "moe.kyokobot.libdave:impl-jni:${libdaveVersion}"
    // Raspberry Pi runtime is linux/arm64 (aarch64); add the matching native
    // libdave bindings. If ever running the app on a different platform
    // (e.g. local x86-64 dev machine), add the matching natives-* artifact
    // too, or the DaveSessionFactory will fail to load its native library.
    runtimeOnly "moe.kyokobot.libdave:natives-linux-aarch64:${libdaveVersion}"

    // ── SQLite ────────────────────────────────────────────────────────────────
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.5.3.Final'

    // ── MinIO / S3 ───────────────────────────────────────────────────────────
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation 'software.amazon.awssdk:s3'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Frontend build ────────────────────────────────────────────────────────────
def frontendDir = "$projectDir/frontend"
def frontendBuildDir = "$frontendDir/dist"
def staticOutputDir = "$projectDir/src/main/resources/static"

task installFrontend(type: Exec) {
    workingDir frontendDir
    inputs.file "$frontendDir/package.json"
    outputs.dir "$frontendDir/node_modules"
    commandLine 'npm', 'install'
}

task buildFrontend(type: Exec, dependsOn: installFrontend) {
    workingDir frontendDir
    inputs.dir "$frontendDir/src"
    inputs.file "$frontendDir/package.json"
    outputs.dir frontendBuildDir
    commandLine 'npm', 'run', 'build'
}

task copyFrontend(type: Copy, dependsOn: buildFrontend) {
    from frontendBuildDir
    into staticOutputDir
}

processResources.dependsOn copyFrontend
