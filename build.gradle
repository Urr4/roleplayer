plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'de.urr4.rp'
version = '0.0.1-SNAPSHOT'
description = 'roleplayer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'net.dv8tion:JDA:5.1.2'
    implementation 'club.minnced:opus-java:1.1.1'

    // ── SQLite ────────────────────────────────────────────────────────────────
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.5.3.Final'

    // ── MinIO / S3 ───────────────────────────────────────────────────────────
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation 'software.amazon.awssdk:s3'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Frontend build ────────────────────────────────────────────────────────────
def frontendDir = "$projectDir/frontend"
def frontendBuildDir = "$frontendDir/dist"
def staticOutputDir = "$projectDir/src/main/resources/static"

task installFrontend(type: Exec) {
    workingDir frontendDir
    inputs.file "$frontendDir/package.json"
    outputs.dir "$frontendDir/node_modules"
    commandLine 'npm', 'install'
}

task buildFrontend(type: Exec, dependsOn: installFrontend) {
    workingDir frontendDir
    inputs.dir "$frontendDir/src"
    inputs.file "$frontendDir/package.json"
    outputs.dir frontendBuildDir
    commandLine 'npm', 'run', 'build'
}

task copyFrontend(type: Copy, dependsOn: buildFrontend) {
    from frontendBuildDir
    into staticOutputDir
}

processResources.dependsOn copyFrontend
